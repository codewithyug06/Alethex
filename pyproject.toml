[project]
name = "alethex"
version = "0.1.2"
description = "Temporal Belief Consistency Engine — catch AI self-contradictions in real time"
authors = [
    { name = "Yugendhar S", email = "jeevithamproject@gmail.com" }
]
license = "Apache-2.0"
keywords = ["nli", "contradiction-detection", "temporal-reasoning", "belief-graph", "rag", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "spacy>=3.0",
    "sentence-transformers>=2.0",
    "transformers>=4.30",
    "torch>=2.0",
    "networkx>=3.0",
    "streamlit>=1.20",
    "plotly>=5.0",
    "pydantic>=2.0",
    "dateparser>=1.1",
    "openai>=1.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "python-dateutil>=2.8",
    "datasets>=2.0",
    "scikit-learn>=1.0",
    "onnxruntime>=1.16",
    "onnx>=1.14",
    "click>=8.0",
    "pandas>=1.5",
    "requests>=2.28",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "loguru>=0.7",
]
readme = "README.md"
requires-python = ">= 3.9"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]
langchain = ["langchain>=0.1"]
llamaindex = ["llama-index>=0.10"]

[project.urls]
Homepage = "https://github.com/codewithyug06/Alethex"
Repository = "https://github.com/codewithyug06/Alethex"
"Bug Tracker" = "https://github.com/codewithyug06/Alethex/issues"
"Model Card" = "https://huggingface.co/codewithyug/alethex-nli-deberta-v3-large"

[project.scripts]
alethex = "alethex.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["alethex*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
ignore = []
