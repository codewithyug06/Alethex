# NLI fine-tuning defaults for the laptop GPU (RTX 4050, 6.4GB VRAM). Override via --config.
# nli-deberta-v3-SMALL: 22M params (vs 400M for -large).
# Estimated laptop throughput: ~55-70 samples/sec -> full run ~7-9h on RTX 4050.
# Same checkpoint used in the browser extension (nli_worker.js) — fine-tuning it directly
# means you can export ONNX after training and drop it into the extension to make in-browser
# detection smarter without touching any other code.
model_name: "cross-encoder/nli-deberta-v3-small"
epochs: 3
batch_size: 32
grad_accum: 1
learning_rate: 1.0e-5
save_steps: 500
per_device_eval_batch_size: 16
eval_accumulation_steps: 10
weight_decay: 0.01
warmup_ratio: 0.1
save_total_limit: 3
logging_steps: 100
logging_steps_test_mode: 50
optimizer: "adamw_bnb_8bit"
test_batch_size: 4
test_grad_accum: 1
# Dataset paths, relative to ALETHEX_HOME (defaults to repo root).
preprocessed_train: "dataset/preprocessed/nli/unified/train.jsonl"
preprocessed_validation: "dataset/preprocessed/nli/unified/validation.jsonl"
fallback_datasets:
  - "dataset/tasksource_temporal-nli/train.jsonl"
  - "dataset/stanfordnlp_snli/train.jsonl"
  - "dataset/nyu-mll_multi_nli/train.jsonl"
output_dir: "models/alethex-nli"
results_dir: "results/training_3_epochs"

